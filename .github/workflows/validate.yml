name: Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    name: Listings, types and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate listings
        run: npm run validate

      - name: Type and Astro check
        run: npm run check

      - name: Build
        run: npm run build
